# Builds and publishes the site to GitHub Pages.
#
# Before publishing it runs scripts/build_static.py, which reads the Google
# Sheet and the posts to generate feed.xml, the per-post link-preview pages
# and the photo gallery. Those generated files are never committed; they
# only exist in the published site.
#
# Runs on every push to master, once a day (to pick up new posts), and on
# demand: GitHub → Actions → "Build and deploy site" → Run workflow.
#
# Requires Settings → Pages → Source: "GitHub Actions".
name: Build and deploy site

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Pillow (resizes gallery photos)
        run: pip install pillow

      - name: Build feed.xml, preview pages and gallery
        run: python3 scripts/build_static.py

      - name: Collect the files to publish
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' --exclude '.github' --exclude '_site' \
            --exclude 'scripts' --exclude 'node_modules' --exclude '.idea' \
            --exclude 'package.json' --exclude 'package-lock.json'
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
