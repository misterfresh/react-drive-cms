    <link href="/home/assets/favicon.ico" rel="shortcut icon" type="image/x-icon"/>
    <script type="text/javascript">
        // Apply the visitor's saved Light/Dark choice before the page paints.
        try {
            var savedTheme = localStorage.getItem('theme')
            if (savedTheme === 'light' || savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', savedTheme)
            }
        } catch (e) {}
    </script>
    <script type="text/javascript">
        // Credits: Single Page Apps for GitHub Pages
        // https://github.com/rafrex/spa-github-pages
        // Copyright (c) 2016 Rafael Pedicini, licensed under the MIT License
        // ----------------------------------------------------------------------
        (function(l) {
            if (l.search) {
                var q = {};
                l.search.slice(1).split('&').forEach(function(v) {
                    var a = v.split('=');
                    q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
                });
                if (q.p !== undefined) {
                    window.history.replaceState(null, null,
                        l.pathname.slice(0, -1) + (q.p || '') +
                        (q.q ? ('?' + q.q) : '') +
                        l.hash
                    );
                }
            }
        }(window.location))
    </script>
    <script type="text/javascript" src="/home/conf.js"></script>
    <script async type="module" src="/home/app/app.js"></script>
    <style>
        /* ---------- Design tokens ---------- */
        :root {
            --c-bg: #fcfafd;
            --c-surface: #ffffff;
            --c-surface-2: #f5f0f7;
            --c-text: #2b2430;
            --c-text-muted: #6e6577;
            --c-border: #ebe4ef;
            --c-brand: #6d2c7f;
            --c-brand-strong: #561f66;
            --c-brand-soft: #f1e6f5;
            --c-on-brand: #ffffff;
            --c-menu-bg: #2e1238;
            --c-menu-text: #f6eef9;
            --c-menu-muted: #c9b6d2;
            --c-menu-accent: #e6bcf4;
            --c-success: #2f7d4f;
            --c-danger: #b3261e;
            --c-scrim: linear-gradient(to top, rgba(20, 8, 26, 0.82) 0%, rgba(20, 8, 26, 0.35) 55%, rgba(20, 8, 26, 0) 100%);

            --font-serif: 'Noto Serif', 'Noto Serif JP', Georgia, serif;
            --font-sans: 'Noto Sans', 'Noto Sans JP', system-ui, -apple-system, 'Segoe UI', sans-serif;

            --radius: 12px;
            --radius-sm: 8px;
            --shadow-sm: 0 1px 2px rgba(40, 14, 52, 0.06), 0 1px 3px rgba(40, 14, 52, 0.08);
            --shadow-md: 0 4px 14px rgba(40, 14, 52, 0.09), 0 2px 4px rgba(40, 14, 52, 0.06);
            --shadow-lg: 0 14px 36px rgba(40, 14, 52, 0.16), 0 4px 10px rgba(40, 14, 52, 0.08);
            --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
            --dur: 200ms;
        }
        /* Dark colours: used when the device is in dark mode (unless the
           visitor picked Light), or when the visitor picked Dark. */
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --c-bg: #141016;
                --c-surface: #1c1720;
                --c-surface-2: #251e2a;
                --c-text: #ece6f0;
                --c-text-muted: #a99fb2;
                --c-border: #322a38;
                --c-brand: #cf9be3;
                --c-brand-strong: #e0b8ef;
                --c-brand-soft: #2c2033;
                --c-on-brand: #1a0f20;
                --c-menu-bg: #1b0f21;
                --c-success: #6fcf97;
                --c-danger: #f28b82;
                --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
                --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.45);
                --shadow-lg: 0 14px 36px rgba(0, 0, 0, 0.55);
            }
        }
        :root[data-theme="dark"] {
            color-scheme: dark;
            --c-bg: #141016;
            --c-surface: #1c1720;
            --c-surface-2: #251e2a;
            --c-text: #ece6f0;
            --c-text-muted: #a99fb2;
            --c-border: #322a38;
            --c-brand: #cf9be3;
            --c-brand-strong: #e0b8ef;
            --c-brand-soft: #2c2033;
            --c-on-brand: #1a0f20;
            --c-menu-bg: #1b0f21;
            --c-success: #6fcf97;
            --c-danger: #f28b82;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
            --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.45);
            --shadow-lg: 0 14px 36px rgba(0, 0, 0, 0.55);
        }
        :root[data-theme="light"] {
            color-scheme: light;
        }
        :lang(zh-Hant) {
            --font-serif: 'Noto Serif', 'Noto Serif TC', Georgia, serif;
        }

        /* ---------- Base ---------- */
        html {
            font-size: 10px;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }
        body {
            color: var(--c-text);
            background-color: var(--c-bg);
            font-family: var(--font-serif);
            font-size: 1.7rem;
            line-height: 1.7;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }
        #app-mount {
            min-height: 100vh;
            position: relative;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        h1, h2, h3, h4 {
            color: var(--c-text);
            line-height: 1.25;
        }
        a {
            color: var(--c-brand);
            text-decoration: none;
            background-color: transparent;
            transition: color var(--dur) var(--ease);
        }
        a:hover, a:focus {
            color: var(--c-brand-strong);
            text-decoration: none;
        }
        img {
            max-width: 100%;
        }
        ::selection {
            background: var(--c-brand-soft);
            color: var(--c-text);
        }

        .visually-hidden {
            position: absolute !important;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
        }

        /* ---------- Photos: blurred preview, then fade in ---------- */
        .blur-image {
            position: relative;
            display: block;
            overflow: hidden;
            background-color: var(--c-surface-2);
        }
        .blur-image::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: var(--preview, none);
            background-size: cover;
            background-position: center;
            filter: blur(14px) saturate(1.3);
            transform: scale(1.15);
            transition: opacity 600ms var(--ease);
        }
        .blur-image > img {
            position: relative;
            opacity: 0;
            transition: opacity 600ms var(--ease);
        }
        .blur-image.is-loaded > img {
            opacity: 1;
        }
        .blur-image.is-loaded::before {
            opacity: 0;
        }
        .blur-image-fill {
            width: 100%;
            height: 100%;
        }
        @media (prefers-reduced-motion: reduce) {
            .blur-image > img,
            .blur-image::before {
                transition: none;
            }
        }

        /* ---------- Focus: visible for keyboard users only ---------- */
        html :focus-visible {
            outline: 2px solid var(--c-brand);
            outline-offset: 3px;
            border-radius: 4px;
        }
        html :focus:not(:focus-visible) {
            outline: none;
        }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div id='app-mount'></div>
</body>
</html>
